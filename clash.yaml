# 按从上到下的顺序匹配分流规则
rules:
  # 局域网与回环地址直连。
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - RULE-SET,拦截规则,REJECT
  - RULE-SET,直连规则,DIRECT
  # 人工智能与苹果代理优先于谷歌、苹果通用规则。
  - RULE-SET,人工智能规则,人工智能
  - RULE-SET,苹果代理规则,苹果代理
  - RULE-SET,苹果服务规则,苹果服务
  - RULE-SET,油管视频规则,油管视频
  # 谷歌网盘必须先于谷歌通用域名匹配。
  - RULE-SET,视频与网盘规则,视频与网盘
  - RULE-SET,谷歌服务规则,谷歌服务
  - RULE-SET,社交平台规则,脸书与社交
  - RULE-SET,美国服务规则,美国服务
  - RULE-SET,美国手机卡规则,美国手机卡
  - RULE-SET,网页浏览规则,网页浏览
  - GEOIP,CN,DIRECT
  - MATCH,兜底
