# Clash/Mihomo 配置；需要 Mihomo 内核。
# 先把自己的节点粘贴到 proxies 下，再在客户端的“节点选择”中选择节点。
# 当前没有真实节点；添加前仅能直连。请勿将节点密码提交到公开仓库。
# 混合代理端口
mixed-port: 7890
# 是否允许局域网设备连接
allow-lan: false
# 使用规则分流模式
mode: rule
# 日志级别
log-level: info
# 是否启用互联网第六版协议
ipv6: false
# 并发建立连接
tcp-concurrent: true
# 保存客户端使用状态
profile:
  store-selected: true
  store-fake-ip: true

# 如客户端已管理 TUN 开关，可在客户端开启。
# 虚拟网卡设置
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

# 域名解析设置
dns:
  enable: true
  # 使用普通 DoH（HTTPS/TCP），兼容不支持 UDP 转发的代理节点。
  prefer-h3: false
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点服务器域名直连解析，避免 DNS 依赖代理自身。
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  # 其余域名使用国外 DoH，通过“节点选择”发送请求。
  # 必须先在该策略组选择真实节点；选择 DIRECT 时仍会直连。
  nameserver:
    - "https://1.1.1.1/dns-query#节点选择"
    - "https://8.8.8.8/dns-query#节点选择"
  # 国内域名使用国内 DoH；需要客户端的 geosite.dat 包含 cn 分类。
  nameserver-policy:
    "geosite:cn":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"

# 将 [] 删除，在下一行粘贴安装脚本输出的“  - name: ...”整段。
# 节点填写区域
proxies: []
# 示例结构（填写真实参数后取消注释）：
#  - name: 我的节点
#    type: vless
#    server: 填写服务器地址
#    port: 443
#    uuid: 填写节点用户标识
#    network: tcp
#    udp: true
#    tls: true
#    flow: xtls-rprx-vision
#    servername: 填写伪装域名
#    client-fingerprint: chrome
#    reality-opts:
#      public-key: 填写公钥
#      short-id: "填写短标识"

# 手动选择各类服务使用的节点
proxy-groups:
  - name: 节点选择
    type: select
    include-all: true
    proxies:
      - DIRECT
  - name: 人工智能
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 苹果代理
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
  - name: 油管视频
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 视频与网盘
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 谷歌服务
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 脸书与社交
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 美国服务
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 美国手机卡
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 网页浏览
    type: select
    proxies:
      - 节点选择
      - DIRECT
  - name: 兜底
    type: select
    proxies:
      - 节点选择
      - DIRECT

