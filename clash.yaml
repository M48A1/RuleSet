# Clash/Mihomo 配置；需要 Mihomo 内核。
# 先在本地填写 proxies 下的节点参数，再为各服务选择 Proxy、SGP、SJC、GEN2、FRA 或 reflect。
# 当前 5 个节点均为占位模板，无法连接；填写前请保持 DIRECT。请勿将真实节点认证信息提交到公开仓库。
# 混合代理端口
mixed-port: 7890
# 是否允许局域网设备连接
allow-lan: false
# 使用规则分流模式
mode: rule
# 日志级别
log-level: info
# 是否启用互联网第六版协议
ipv6: false
# 并发建立连接
tcp-concurrent: true
# GEO 数据库：供 geosite:cn DNS 策略和 GEOIP,CN 分流使用。
# GEOIP 使用 MMDB 模式；geosite 使用独立的 geosite.dat。
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24 # 小时
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# 保存客户端使用状态
profile:
  store-selected: true
  store-fake-ip: true

# 如客户端已管理 TUN 开关，可在客户端开启。
# 虚拟网卡设置
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

# 域名解析设置
dns:
  enable: true
  # 使用普通 DoH（HTTPS/TCP），兼容不支持 UDP 转发的代理节点。
  prefer-h3: false
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点服务器域名直连解析，避免 DNS 依赖代理自身。
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  # 其余域名使用国外 DoH，通过“Proxy”发送请求。
  # 必须先在该策略组选择真实节点；选择 DIRECT 时仍会直连。
  nameserver:
    - "https://1.1.1.1/dns-query#Proxy"
    - "https://8.8.8.8/dns-query#Proxy"
  # 国内域名使用国内 DoH；需要客户端的 geosite.dat 包含 cn 分类。
  nameserver-policy:
    "geosite:cn":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"

# 节点模板：以下为 VLESS + TCP + TLS，占位参数不能用于连接。
# 请在本地副本中替换 server、port、uuid 和 servername；不要公开真实认证信息。
# 如使用 Reality，请按服务端配置启用各节点下方的 flow / reality-opts，
# 并填写 public-key、short-id；普通 TLS 节点不要启用这些 Reality 字段。
proxies:
  - name: SGP-Node
    type: vless
    server: sgp.example.invalid # 替换为服务器域名或 IP
    port: 443 # 替换为实际端口
    uuid: "00000000-0000-4000-8000-000000000001" # 占位 UUID，请替换
    network: tcp
    udp: true
    tls: true
    servername: example.invalid # 替换为实际 TLS SNI
    client-fingerprint: chrome
    # flow: xtls-rprx-vision # 仅在服务端启用该流控时填写
    # reality-opts:
    #   public-key: "YOUR_PUBLIC_KEY"
    #   short-id: "YOUR_SHORT_ID"

  - name: SJC-Node
    type: vless
    server: sjc.example.invalid # 替换为服务器域名或 IP
    port: 443 # 替换为实际端口
    uuid: "00000000-0000-4000-8000-000000000002" # 占位 UUID，请替换
    network: tcp
    udp: true
    tls: true
    servername: example.invalid # 替换为实际 TLS SNI
    client-fingerprint: chrome
    # flow: xtls-rprx-vision # 仅在服务端启用该流控时填写
    # reality-opts:
    #   public-key: "YOUR_PUBLIC_KEY"
    #   short-id: "YOUR_SHORT_ID"

  - name: GEN2-Node
    type: vless
    server: gen2.example.invalid # 替换为服务器域名或 IP
    port: 443 # 替换为实际端口
    uuid: "00000000-0000-4000-8000-000000000003" # 占位 UUID，请替换
    network: tcp
    udp: true
    tls: true
    servername: example.invalid # 替换为实际 TLS SNI
    client-fingerprint: chrome
    # flow: xtls-rprx-vision # 仅在服务端启用该流控时填写
    # reality-opts:
    #   public-key: "YOUR_PUBLIC_KEY"
    #   short-id: "YOUR_SHORT_ID"

  - name: FRA-Node
    type: vless
    server: fra.example.invalid # 替换为服务器域名或 IP
    port: 443 # 替换为实际端口
    uuid: "00000000-0000-4000-8000-000000000004" # 占位 UUID，请替换
    network: tcp
    udp: true
    tls: true
    servername: example.invalid # 替换为实际 TLS SNI
    client-fingerprint: chrome
    # flow: xtls-rprx-vision # 仅在服务端启用该流控时填写
    # reality-opts:
    #   public-key: "YOUR_PUBLIC_KEY"
    #   short-id: "YOUR_SHORT_ID"

  - name: reflect-Node
    type: vless
    server: reflect.example.invalid # 替换为服务器域名或 IP
    port: 443 # 替换为实际端口
    uuid: "00000000-0000-4000-8000-000000000005" # 占位 UUID，请替换
    network: tcp
    udp: true
    tls: true
    servername: example.invalid # 替换为实际 TLS SNI
    client-fingerprint: chrome
    # flow: xtls-rprx-vision # 仅在服务端启用该流控时填写
    # reality-opts:
    #   public-key: "YOUR_PUBLIC_KEY"
    #   short-id: "YOUR_SHORT_ID"

# 手动选择各类服务使用的节点
proxy-groups:
  # 拒绝规则命中后交由 antiad 组处理。
  - name: antiad
    type: select
    proxies:
      - REJECT
  - name: Proxy
    type: select
    include-all: true
    proxies:
      - DIRECT
  - name: SGP
    type: select
    proxies:
      - SGP-Node
  - name: SJC
    type: select
    proxies:
      - SJC-Node
  - name: GEN2
    type: select
    proxies:
      - GEN2-Node
  - name: FRA
    type: select
    proxies:
      - FRA-Node
  - name: reflect
    type: select
    proxies:
      - reflect-Node
  - name: AI
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: AppleProxy
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
  - name: YouTube
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: Video
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: Google
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: Meta
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: USHome
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: UltraMobile
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: Surfing
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT
  - name: Final
    type: select
    proxies:
      - Proxy
      - SGP
      - SJC
      - GEN2
      - FRA
      - reflect
      - DIRECT

